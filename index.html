<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mak Software | Loading...</title>

    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #2f81f7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #error-state {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="loading-state">
    <div class="loader"></div>
</div>

<div id="error-state">
    <h2>Service Temporarily Unavailable</h2>
    <p>We are currently undergoing maintenance. Please check back shortly.</p>
</div>

<script>
    (function () {
        const spaUrl = atob('aHR0cHM6Ly9jcy5tYWtzb2Z0d2FyZS5pbi9tcy8=');
        const maxDelay = 30000;
        const steadyDelay = 30000;
        const initialAttempts = 6;

        let attempt = 0;
        let redirected = false;
        let pollTimer = null;

        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Secure private logging
        function logErrorSecurely(context, errorMessage) {
            fetch('https://maksoftware.in/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    context: context,
                    message: errorMessage,
                    timestamp: new Date().toISOString()
                })
            }).catch(() => {});
        }

        // Minimal fallback UI
        function showFallback() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        }

        async function renderNewApp() {
            if (redirected) return;
            redirected = true;

            try {
                const response = await fetch(spaUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                let html = await response.text();

                // Automatically inject the <base> tag to fix relative path 404s
                const baseUrl = new URL('.', spaUrl).href;
                html = html.replace('<head>', `<head><base href="${baseUrl}">`);

                document.open();
                document.write(html);
                document.close();

            } catch (error) {
                logErrorSecurely('SPA injection failed', error.message);
                redirected = false;
                showFallback();
            }
        }

        function withCacheBust(url) {
            const sep = url.includes('?') ? '&' : '?';
            return `${url}${sep}cb=${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        async function checkSpaAvailability() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            try {
                const probeUrl = withCacheBust(spaUrl);
                const response = await fetch(probeUrl, {
                    method: 'GET',
                    signal: controller.signal,
                    cache: 'no-store',
                    redirect: 'follow'
                });

                clearTimeout(timeoutId);

                if (response.ok || (response.status >= 300 && response.status < 400) || response.type === 'opaque') {
                    return true;
                }
                return false;
            } catch (error) {
                clearTimeout(timeoutId);
                return false;
            }
        }

        async function runOneCheck() {
            if (redirected) return true;
            try {
                const isAvailable = await checkSpaAvailability();
                if (isAvailable) {
                    renderNewApp();
                    return true;
                }
                return false;
            } catch (err) {
                return false;
            }
        }

        // Initialization and Polling
        (async function pollBootstrap() {
            while (attempt < initialAttempts && !redirected) {
                attempt++;
                const ok = await runOneCheck();
                if (ok) return;

                const baseDelay = Math.min(maxDelay, Math.pow(2, Math.min(attempt, 8)) * 1000);
                const delay = Math.min(maxDelay, baseDelay + (Math.random() * 1000));
                await wait(delay);
            }

            // If fast retries fail, show the minimal error state to the user
            if (!redirected) showFallback();

            // Keep polling in the background so it auto-recovers
            pollTimer = setInterval(runOneCheck, steadyDelay);

            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) runOneCheck();
            });

            window.addEventListener('beforeunload', () => {
                if (pollTimer) clearInterval(pollTimer);
            });
        })();
    })();
</script>
</body>
</html>
